name: Core tests (not GPU acceptance)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip freeze --exclude-editable > audit-requirements.txt
      # Audit the exact tested dependency set with a supported auditor runtime.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .audit-venv
      - run: .audit-venv/bin/python -m pip install --upgrade pip setuptools pip-audit
      - run: .audit-venv/bin/python -m pip_audit --no-deps --disable-pip -r audit-requirements.txt
